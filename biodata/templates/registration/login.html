<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Data Pekerja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 380px; margin-top: 12vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="mb-3 text-center">Sistem Data Pekerja</h5>
            {% if form.errors %}
                <div class="alert alert-danger py-2">Username atau password salah.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button class="btn btn-primary w-100" type="submit">Masuk</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
